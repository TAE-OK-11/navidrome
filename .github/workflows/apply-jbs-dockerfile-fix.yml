name: Apply direct JBS metadata worker fix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-jbs-dockerfile-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Patch Dockerfile.jbs
        shell: python
        run: |
          from pathlib import Path

          bs = chr(92)
          path = Path("Dockerfile.jbs")
          text = path.read_text()

          marker = "\n".join([
              "# =========================================================",
              "# Tokio-quiche HTTP/3 companion",
              "# =========================================================",
          ])

          stage = "\n".join([
              "# =========================================================",
              "# Rust Lofty metadata worker",
              "# Native tag scanning + embedded cover extraction",
              "# =========================================================",
              "",
              "FROM ${RUST_IMAGE} AS metadata-builder",
              "",
              "ARG NAVIDROME_BUILD_CORES",
              "ARG RUST_TARGET_CPU",
              "",
              "RUN --mount=type=cache,target=/var/cache/apt,sharing=locked --mount=type=cache,target=/var/lib/apt,sharing=locked apt-get update && apt-get install -y --no-install-recommends ca-certificates",
              "",
              "WORKDIR /build",
              "",
              "COPY --link --from=source /src/rust/metadata/Cargo.toml /src/rust/metadata/Cargo.lock ./",
              "COPY --link --from=source /src/rust/metadata/src ./src",
              "COPY --link --from=source /src/core/artwork/e2e/testdata/embedded_art.mp3 /tmp/embedded_art.mp3",
              "",
              "RUN --mount=type=cache,target=/usr/local/cargo/registry,sharing=locked --mount=type=cache,target=/usr/local/cargo/git,sharing=locked CARGO_BUILD_JOBS=\"${NAVIDROME_BUILD_CORES}\" RUSTFLAGS=\"-C target-cpu=${RUST_TARGET_CPU}\" cargo test --locked --release && CARGO_BUILD_JOBS=\"${NAVIDROME_BUILD_CORES}\" RUSTFLAGS=\"-C target-cpu=${RUST_TARGET_CPU}\" cargo build --locked --release && install -D -m 755 target/release/navidrome-metadata /out/navidrome-metadata && /out/navidrome-metadata --extract-picture /tmp/embedded_art.mp3 > /tmp/embedded-cover.bin && test -s /tmp/embedded-cover.bin && test -x /out/navidrome-metadata",
              "",
          ])

          if "FROM ${RUST_IMAGE} AS metadata-builder" not in text:
              if marker not in text:
                  raise SystemExit("HTTP/3 stage marker not found")
              text = text.replace(marker, stage + "\n" + marker, 1)

          h3_copy = "COPY --link --chown=1000:1000 --chmod=750 --from=h3-builder /out/navidrome-h3 /app/navidrome-h3\n"
          worker_copy = "COPY --link --chown=1000:1000 --chmod=750 --from=metadata-builder /out/navidrome-metadata /app/navidrome-metadata\n"
          if worker_copy not in text:
              if h3_copy not in text:
                  raise SystemExit("H3 runtime copy marker not found")
              text = text.replace(h3_copy, h3_copy + worker_copy, 1)

          h3_check = "    test -x /app/navidrome-h3 && " + bs + "\n"
          worker_check = "    test -x /app/navidrome-metadata && " + bs + "\n"
          if worker_check not in text:
              if h3_check not in text:
                  raise SystemExit("H3 runtime check marker not found")
              text = text.replace(h3_check, h3_check + worker_check, 1)

          ffmpeg_env = "    ND_FFMPEGPATH=/usr/local/bin/ffmpeg " + bs + "\n"
          worker_env = "    ND_METADATAWORKERPATH=/app/navidrome-metadata " + bs + "\n"
          if worker_env not in text:
              if ffmpeg_env not in text:
                  raise SystemExit("FFmpeg env marker not found")
              text = text.replace(ffmpeg_env, ffmpeg_env + worker_env, 1)

          old = "    ND_SCANNER_EXTRACTOR=taglib " + bs + "\n"
          new = "    ND_SCANNER_EXTRACTOR=lofty " + bs + "\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("scanner extractor setting not found")

          required = [
              "FROM ${RUST_IMAGE} AS metadata-builder",
              "/out/navidrome-metadata /app/navidrome-metadata",
              "ND_METADATAWORKERPATH=/app/navidrome-metadata",
              "ND_SCANNER_EXTRACTOR=lofty",
              "--extract-picture /tmp/embedded_art.mp3",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f"validation failed: {item}")

          path.write_text(text)

      - name: Commit direct fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add Dockerfile.jbs
          git commit -m "fix(jbs): ship native Lofty metadata worker"
          git push origin HEAD:master
