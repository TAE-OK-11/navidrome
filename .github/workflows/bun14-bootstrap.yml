name: Bootstrap Bun 1.4 migration

on:
  push:
    branches:
      - chore/bun-1.4-selective-upstream

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: bootstrap Bun 1.4 migration'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bun-1.4-selective-upstream
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Bun 1.4 canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Resolve exact Bun and image pins
        shell: bash
        run: |
          set -euo pipefail
          BUN_VERSION="$(bun --version)"
          case "${BUN_VERSION}" in
            1.4.*) ;;
            *) echo "Expected Bun 1.4 canary, got ${BUN_VERSION}" >&2; exit 1 ;;
          esac
          BUN_ALPINE_DIGEST="$(docker buildx imagetools inspect oven/bun:canary-alpine | awk '/^Digest:/ {print $2; exit}')"
          BUN_DEBIAN_DIGEST="$(docker buildx imagetools inspect oven/bun:canary-debian | awk '/^Digest:/ {print $2; exit}')"
          test -n "${BUN_ALPINE_DIGEST}"
          test -n "${BUN_DEBIAN_DIGEST}"
          echo "BUN_VERSION=${BUN_VERSION}" >> "$GITHUB_ENV"
          echo "BUN_ALPINE_DIGEST=${BUN_ALPINE_DIGEST}" >> "$GITHUB_ENV"
          echo "BUN_DEBIAN_DIGEST=${BUN_DEBIAN_DIGEST}" >> "$GITHUB_ENV"
          echo "Bun ${BUN_VERSION}"
          echo "Alpine ${BUN_ALPINE_DIGEST}"
          echo "Debian ${BUN_DEBIAN_DIGEST}"

      - name: Generate Bun lockfile from the current dependency graph
        working-directory: ui
        run: bun install --lockfile-only

      - name: Rewrite Node/npm build tooling to Bun
        run: |
          set -euo pipefail
          python3 scripts/bun14_migrate.py
          rm -f .nvmrc ui/package-lock.json
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['BUN_VERSION']
          p = Path('.devcontainer/Dockerfile')
          s = p.read_text().replace('ARG BUN_VERSION="canary"', f'ARG BUN_VERSION="bun-v{version}"')
          p.write_text(s)
          p = Path('.devcontainer/devcontainer.json')
          s = p.read_text().replace('"BUN_VERSION": "canary"', f'"BUN_VERSION": "bun-v{version}"')
          p.write_text(s)
          PY

      - name: Verify Bun dependency graph
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: UI formatting, lint, tests, typecheck and build
        working-directory: ui
        run: |
          bun run check-formatting
          bun run lint
          bun run test
          bun run type-check
          bun run build

      - name: Verify standard Docker UI stage
        run: docker build --target ui-bundle -t navidrome-ui-bun14 .

      - name: Verify JBS Docker UI stage
        run: docker build -f Dockerfile.jbs --target jsbuilder -t navidrome-jbs-ui-bun14 .

      - name: Go regression tests
        run: go test -tags netgo,sqlite_fts5 ./...

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "chore(ui): replace Node.js/npm toolchain with Bun ${BUN_VERSION}"
          git push origin HEAD:chore/bun-1.4-selective-upstream
