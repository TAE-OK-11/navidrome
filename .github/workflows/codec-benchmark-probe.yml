name: API compression codec probe

on:
  push:
    branches:
      - perf/jbs-ghcr-quic-network
    paths:
      - .github/workflows/codec-benchmark-probe.yml

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/jbs-ghcr-quic-network
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate temporary codec benchmark
        run: |
          cat > server/codec_probe_test.go <<'EOF'
          package server

          import (
            "bytes"
            stdgzip "compress/gzip"
            "fmt"
            "io"
            "testing"

            "github.com/andybalholm/brotli"
            kpgzip "github.com/klauspost/compress/gzip"
            "github.com/klauspost/compress/zstd"
          )

          func benchmarkPayload(size int) []byte {
            unit := []byte(`{"id":"track-123","title":"Taylor Swift","artist":"Taylor Swift","album":"Midnights","year":2022,"favorite":true}`)
            out := make([]byte, 0, size)
            for len(out) < size {
              remaining := size - len(out)
              if remaining < len(unit) {
                out = append(out, unit[:remaining]...)
                break
              }
              out = append(out, unit...)
            }
            return out
          }

          func BenchmarkCodecProbe(b *testing.B) {
            for _, size := range []int{1024, 16 << 10, 256 << 10} {
              payload := benchmarkPayload(size)
              b.Run(fmt.Sprintf("size_%d/zstd_1", size), func(b *testing.B) {
                enc, err := zstd.NewWriter(io.Discard, zstd.WithEncoderLevel(zstd.EncoderLevelFromZstd(1)), zstd.WithEncoderConcurrency(1))
                if err != nil { b.Fatal(err) }
                defer enc.Close()
                b.ReportAllocs(); b.SetBytes(int64(len(payload)))
                for b.Loop() { enc.Reset(io.Discard); _, _ = enc.Write(payload); _ = enc.Close() }
              })
              b.Run(fmt.Sprintf("size_%d/zstd_3", size), func(b *testing.B) {
                enc, err := zstd.NewWriter(io.Discard, zstd.WithEncoderLevel(zstd.EncoderLevelFromZstd(3)), zstd.WithEncoderConcurrency(1))
                if err != nil { b.Fatal(err) }
                defer enc.Close()
                b.ReportAllocs(); b.SetBytes(int64(len(payload)))
                for b.Loop() { enc.Reset(io.Discard); _, _ = enc.Write(payload); _ = enc.Close() }
              })
              b.Run(fmt.Sprintf("size_%d/brotli_5", size), func(b *testing.B) {
                var dst bytes.Buffer
                w := brotli.NewWriterLevel(&dst, 5)
                b.ReportAllocs(); b.SetBytes(int64(len(payload)))
                for b.Loop() { dst.Reset(); w.Reset(&dst); _, _ = w.Write(payload); _ = w.Close() }
              })
              b.Run(fmt.Sprintf("size_%d/std_gzip_4", size), func(b *testing.B) {
                var dst bytes.Buffer
                w, err := stdgzip.NewWriterLevel(&dst, 4)
                if err != nil { b.Fatal(err) }
                b.ReportAllocs(); b.SetBytes(int64(len(payload)))
                for b.Loop() { dst.Reset(); w.Reset(&dst); _, _ = w.Write(payload); _ = w.Close() }
              })
              b.Run(fmt.Sprintf("size_%d/kp_gzip_4", size), func(b *testing.B) {
                var dst bytes.Buffer
                w, err := kpgzip.NewWriterLevel(&dst, 4)
                if err != nil { b.Fatal(err) }
                b.ReportAllocs(); b.SetBytes(int64(len(payload)))
                for b.Loop() { dst.Reset(); w.Reset(&dst); _, _ = w.Write(payload); _ = w.Close() }
              })
            }
          }

          func TestCodecProbeSizes(t *testing.T) {
            for _, size := range []int{1024, 16 << 10, 256 << 10} {
              payload := benchmarkPayload(size)
              results := map[string]int{}

              var dst bytes.Buffer
              z1, err := zstd.NewWriter(&dst, zstd.WithEncoderLevel(zstd.EncoderLevelFromZstd(1)), zstd.WithEncoderConcurrency(1))
              if err != nil { t.Fatal(err) }
              _, _ = z1.Write(payload); _ = z1.Close(); results["zstd_1"] = dst.Len()

              dst.Reset()
              z3, err := zstd.NewWriter(&dst, zstd.WithEncoderLevel(zstd.EncoderLevelFromZstd(3)), zstd.WithEncoderConcurrency(1))
              if err != nil { t.Fatal(err) }
              _, _ = z3.Write(payload); _ = z3.Close(); results["zstd_3"] = dst.Len()

              dst.Reset()
              br := brotli.NewWriterLevel(&dst, 5)
              _, _ = br.Write(payload); _ = br.Close(); results["brotli_5"] = dst.Len()

              dst.Reset()
              sg, err := stdgzip.NewWriterLevel(&dst, 4)
              if err != nil { t.Fatal(err) }
              _, _ = sg.Write(payload); _ = sg.Close(); results["std_gzip_4"] = dst.Len()

              dst.Reset()
              kg, err := kpgzip.NewWriterLevel(&dst, 4)
              if err != nil { t.Fatal(err) }
              _, _ = kg.Write(payload); _ = kg.Close(); results["kp_gzip_4"] = dst.Len()

              fmt.Printf("CODEC_SIZE input=%d zstd_1=%d zstd_3=%d brotli_5=%d std_gzip_4=%d kp_gzip_4=%d\n",
                size, results["zstd_1"], results["zstd_3"], results["brotli_5"], results["std_gzip_4"], results["kp_gzip_4"])
            }
          }
          EOF
      - name: Benchmark latency, allocations and sizes
        run: |
          set -euo pipefail
          {
            go test ./server -run '^TestCodecProbeSizes$' -v -count=1
            go test ./server -run '^$' -bench '^BenchmarkCodecProbe$' -benchmem -benchtime=750ms -count=3
          } | tee /tmp/codec-benchmark.txt
      - name: Commit benchmark result
        run: |
          set -euo pipefail
          mkdir -p .github/benchmark-results
          {
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Runner: ubuntu-latest\n\n'
            cat /tmp/codec-benchmark.txt
          } > .github/benchmark-results/api-compression.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/benchmark-results/api-compression.txt
          git commit -m "test: update API compression codec benchmark"
          git push origin HEAD:perf/jbs-ghcr-quic-network
