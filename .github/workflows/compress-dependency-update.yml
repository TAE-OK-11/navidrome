name: Validate compress dependency update

on:
  push:
    branches:
      - perf/jbs-ghcr-quic-network
    paths:
      - .github/workflows/compress-dependency-update.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/jbs-ghcr-quic-network
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Update dependency
        run: |
          set -euo pipefail
          go get github.com/klauspost/compress@v1.19.1
          go mod tidy
          go mod verify
      - name: Verify affected code
        run: |
          set -euo pipefail
          go test ./server ./server/subsonic -count=1
          go test ./server -run '^Test(BrotliFallbackNeverUsesZstdNumericLevel|BrotliPoolMappingMatchesConfiguredLevels|SensitiveAuthResponsesAreNeverCompressed|CompressionHonorsAcceptEncodingQualityAndWildcard|HTTP3EarlyDataRejectsRequestBodies)$' -count=1
      - name: Commit dependency files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "chore(deps): update klauspost compress to v1.19.1"
          git push origin HEAD:perf/jbs-ghcr-quic-network
