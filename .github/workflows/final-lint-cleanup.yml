name: Final lint cleanup

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: final-lint-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'perf/full-system-stability-rust' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply non-functional lint cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'target not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'server/subsonic/archive_response_stability_test.go',
              'if got := handleArchiveErr(context.Background(), "x", false, want); got != want {',
              'if got := handleArchiveErr(context.Background(), "x", false, want); !errors.Is(got, want) {',
          )

          replace_once(
              'core/artwork/security_regression_test.go',
              '\t_, err := client.Get("http://initial.test/start")\n',
              '\tresp, err := client.Get("http://initial.test/start")\n\tif resp != nil {\n\t\t_ = resp.Body.Close()\n\t}\n',
          )

          replace_once(
              'conf/configuration_test.go',
              'Expect(os.WriteFile(logFile, []byte("existing"), 0644)).To(Succeed())',
              'Expect(os.WriteFile(logFile, []byte("existing"), 0600)).To(Succeed())',
          )

          replace_once(
              'core/stream/hotcache/resolver.go',
              'maxSize > uint64(^uint64(0)>>1)',
              'maxSize > ^uint64(0)>>1',
          )

          replace_once(
              'core/stream/hotcache/promotion.go',
              'func (r *resolver) promote(ctx context.Context, task *promotionTask) error {',
              '//nolint:gocyclo // Promotion is a single transactional state machine; splitting it obscures cleanup/rollback invariants.\nfunc (r *resolver) promote(ctx context.Context, task *promotionTask) error {',
          )

          replace_once(
              'core/stream/hotcache/sessions.go',
              'func (t *sessionTracker) observe(ctx context.Context, identity streamIdentity, cached bool, observation PlaybackObservation) {',
              '//nolint:gocyclo // Playback observation is a lock-scoped state machine; keeping transitions together protects session invariants.\nfunc (t *sessionTracker) observe(ctx context.Context, identity streamIdentity, cached bool, observation PlaybackObservation) {',
          )
          PY

          gofmt -w \
            server/subsonic/archive_response_stability_test.go \
            core/artwork/security_regression_test.go \
            conf/configuration_test.go \
            core/stream/hotcache/resolver.go \
            core/stream/hotcache/promotion.go \
            core/stream/hotcache/sessions.go

      - name: Focused regression tests
        run: |
          set -euo pipefail
          go mod download
          go test -tags=sqlite_fts5 ./core/artwork ./conf ./core/stream/hotcache ./server/subsonic -count=1

      - name: Full golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          problem-matchers: true
          args: --timeout 4m

      - name: Commit verified lint cleanup and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-lint-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clear final stabilization lint debt'
          git push origin HEAD:perf/full-system-stability-rust
