name: Final network verify

on:
  push:
    branches:
      - perf/jbs-ghcr-quic-network
    paths:
      - .github/workflows/final-network-verify.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/jbs-ghcr-quic-network
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply final measured tuning
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/compression.go')
          s = p.read_text()
          old = 'apiCompressionDecisionBufferSize = 4 << 10'
          new = 'apiCompressionDecisionBufferSize = generalAPICompressedMinSize'
          if old not in s:
              raise SystemExit('API decision buffer target already changed or unexpected')
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w server/compression.go
          go get github.com/klauspost/compress@v1.19.1
          go mod tidy
          go mod verify
      - name: Validate server and QUIC/compression paths
        run: |
          set -euo pipefail
          go test ./server ./server/subsonic -count=1
          go test ./server -run '^Test(BrotliFallbackNeverUsesZstdNumericLevel|HugeBrotliResponseUsesDedicatedHugePoolLevel|BrotliPoolMappingMatchesConfiguredLevels|SensitiveAuthResponsesAreNeverCompressed|CompressionHonorsAcceptEncodingQualityAndWildcard|OrderedPrecompressedEncodingsHonorsQuality)$' -count=1
          go test ./server -run '^$' -bench '^BenchmarkCompressionLargeSingleWrite$' -benchtime=250ms -count=1
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/compression.go go.mod go.sum
          git commit -m "perf(api): lower compression decision latency"
          git push origin HEAD:perf/jbs-ghcr-quic-network
