name: Finalize Lofty Go imports

on:
  push:
    branches: [modernize/phase2-lofty-react19-rust]

permissions:
  contents: write

concurrency:
  group: finalize-lofty-imports
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: modernize/phase2-lofty-react19-rust
          fetch-depth: 0
      - name: Replace residual TagLib Go imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'github.com/navidrome/navidrome/adapters/gotaglib'
          new = 'github.com/navidrome/navidrome/adapters/lofty'
          changed = []
          for path in Path('.').rglob('*.go'):
              if '.git' in path.parts:
                  continue
              text = path.read_text()
              updated = text.replace(old, new)
              updated = updated.replace('Register taglib extractor', 'Register Lofty extractor')
              updated = updated.replace('the taglib extractor', 'the Lofty extractor')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
          git diff --name-only -- '*.go' | xargs -r gofmt -w
          if grep -R -n --include='*.go' -E 'adapters/gotaglib|taglib extractor' .; then
            echo 'residual TagLib Go reference remains' >&2
            exit 1
          fi
          if git diff --quiet; then
            echo 'No residual imports remain'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- '*.go'
          git commit -m 'refactor: finalize Lofty Go imports [lofty-imports]'
          git push origin HEAD:modernize/phase2-lofty-react19-rust
