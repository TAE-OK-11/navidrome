name: Full system runtime audit

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: full-system-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'perf/full-system-stability-rust'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Inventory runtime-risk patterns
        shell: bash
        run: |
          set -euo pipefail
          echo '===== outbound HTTP clients ====='
          rg -n --glob '*.go' 'http\.(DefaultClient|Get|Post|Head)|(&|new\()?http\.Client\{|http\.Transport\{' core server scanner persistence plugins || true
          echo '===== process spawning ====='
          rg -n --glob '*.go' 'exec\.Command(Context)?\(' core server scanner persistence plugins || true
          echo '===== context detachment/background ====='
          rg -n --glob '*.go' 'context\.(Background|TODO|WithoutCancel)\(' core server scanner persistence plugins || true
          echo '===== potentially ignored errors ====='
          rg -n --glob '*.go' '(, _ :=|_, _ =|\b_ = .*\.(Close|Wait|Kill|Shutdown|Stop)\(|CombinedOutput\(\).*$)' core server scanner persistence plugins || true
          echo '===== unbounded goroutine/ticker candidates ====='
          rg -n --glob '*.go' '(go func\(|go [A-Za-z0-9_\.]+\(|time\.(NewTicker|Tick|AfterFunc)\()' core server scanner persistence plugins || true
          echo '===== stream/copy hot paths ====='
          rg -n --glob '*.go' '(io\.Copy(Buffer|N)?\(|io\.ReadAll\(|bytes\.NewBuffer|make\(\[\]byte)' core/stream core/ffmpeg server/subsonic scanner persistence || true

      - name: Vet core runtime packages
        run: |
          set -euo pipefail
          go mod download
          go vet -tags=sqlite_fts5 ./core/ffmpeg/... ./core/stream/... ./core/storage/... ./scanner/... ./persistence/... ./server/subsonic/...

      - name: Test runtime packages
        run: |
          set -euo pipefail
          go test -tags=sqlite_fts5 ./core/ffmpeg/... ./core/stream/... ./core/storage/... ./scanner/... ./persistence/... ./server/subsonic/... -count=1
