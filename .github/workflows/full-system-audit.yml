name: Full system runtime audit

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: full-system-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'perf/full-system-stability-rust'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Inventory runtime-risk patterns
        shell: bash
        run: |
          set -euo pipefail
          roots=(core server scanner persistence plugins)
          echo '===== outbound HTTP clients ====='
          grep -RInE --include='*.go' 'http\.(DefaultClient|Get|Post|Head)|http\.Client\{|http\.Transport\{' "${roots[@]}" | head -n 250 || true
          echo '===== process spawning ====='
          grep -RInE --include='*.go' 'exec\.Command(Context)?\(' "${roots[@]}" | head -n 250 || true
          echo '===== context detachment/background ====='
          grep -RInE --include='*.go' 'context\.(Background|TODO|WithoutCancel)\(' "${roots[@]}" | head -n 250 || true
          echo '===== potentially ignored errors ====='
          grep -RInE --include='*.go' '(, _ :=|_, _ =|_ = .*\.(Close|Wait|Kill|Shutdown|Stop)\(|CombinedOutput\(\))' "${roots[@]}" | head -n 300 || true
          echo '===== goroutine/ticker candidates ====='
          grep -RInE --include='*.go' '(go func\(|go [A-Za-z0-9_\.]+\(|time\.(NewTicker|Tick|AfterFunc)\()' "${roots[@]}" | head -n 300 || true
          echo '===== stream/copy hot paths ====='
          grep -RInE --include='*.go' '(io\.Copy(Buffer|N)?\(|io\.ReadAll\(|bytes\.NewBuffer|make\(\[\]byte)' core/stream core/ffmpeg server/subsonic scanner persistence | head -n 300 || true

      - name: Vet core runtime packages
        run: |
          set -euo pipefail
          go mod download
          go vet -tags=sqlite_fts5 ./core/ffmpeg/... ./core/stream/... ./core/storage/... ./scanner/... ./persistence/... ./server/subsonic/...

      - name: Test runtime packages serially
        run: |
          set -euo pipefail
          # Several package test suites use the same configured SQLite test database;
          # keep package processes serial so cross-package test interference is not
          # mistaken for a product-level locking regression.
          go test -p=1 -tags=sqlite_fts5 ./core/ffmpeg/... ./core/stream/... ./core/storage/... ./scanner/... ./persistence/... ./server/subsonic/... -count=1
