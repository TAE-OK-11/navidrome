name: Update HTTP3 Go module sums

on:
  push:
    branches:
      - feat/http3-quic-go

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/http3-quic-go

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy module metadata
        run: go mod tidy

      - name: Commit generated module metadata
        shell: bash
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "Module metadata is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "build: update module sums for HTTP/3"
          git push origin HEAD:feat/http3-quic-go
