name: JBS Navidrome GHCR

on:
  push:
    branches:
      - master
      - perf/full-system-stability-rust
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "ui/**"
      - "Dockerfile.jbs"
      - ".github/workflows/jbs-ghcr.yml"
  pull_request:
    branches:
      - master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "ui/**"
      - "Dockerfile.jbs"
      - ".github/workflows/jbs-ghcr.yml"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Ignore BuildKit cache"
        type: boolean
        default: false
      pgo:
        description: "Enable Go PGO training"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: jbs-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/tae-ok-11/navidrome
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: true

jobs:
  verify-network:
    name: Verify server, QUIC and compression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module graph
        run: |
          set -euo pipefail
          go mod download
          go mod verify
      - name: Test HTTP server, guarded QUIC 0-RTT and compression
        run: |
          set -euo pipefail
          go test ./server ./server/subsonic -count=1

  build:
    name: Build optimized image
    needs: verify-network
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/perf/full-system-stability-rust' }}
            type=sha,format=short,prefix=sha-

      - name: Build optimized JBS image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.jbs
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
          cache-from: type=gha,scope=jbs-navidrome-amd64
          cache-to: type=gha,scope=jbs-navidrome-amd64,mode=max
          build-args: |
            NAVIDROME_REF=${{ github.sha }}
            NAVIDROME_CACHEBUST=${{ github.sha }}
            GO_PGO_ENABLED=${{ github.event_name != 'workflow_dispatch' || inputs.pgo }}
