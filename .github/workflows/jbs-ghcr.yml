name: JBS GHCR

on:
  push:
    branches: [master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/h3-gateway/**"
      - "rust/metadata/**"
      - "rust/scanner/**"
      - "rust/search/**"
      - "rust/apikeys/**"
      - "rust/integration/**"
      - "rust/grpc-listen/**"
      - "rust/fts-normalize/**"
      - "proto/**"
      - "core/artwork/e2e/testdata/embedded_art.mp3"
      - "ui/**"
      - "release/rust-pgo-train.sh"
      - "release/rust-build.sh"
      - "Dockerfile.jbs"
      - ".github/workflows/jbs-ghcr.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/h3-gateway/**"
      - "rust/metadata/**"
      - "rust/scanner/**"
      - "rust/search/**"
      - "rust/apikeys/**"
      - "rust/integration/**"
      - "rust/grpc-listen/**"
      - "rust/fts-normalize/**"
      - "proto/**"
      - "core/artwork/e2e/testdata/embedded_art.mp3"
      - "ui/**"
      - "release/rust-pgo-train.sh"
      - "release/rust-build.sh"
      - "Dockerfile.jbs"
      - ".github/workflows/jbs-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jbs-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tae-ok-11/navidrome
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build:
    name: Build JBS image
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.jbs
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jbs-navidrome
          cache-to: type=gha,scope=jbs-navidrome,mode=max
          build-args: |
            NAVIDROME_REF=${{ env.SOURCE_SHA }}
            NAVIDROME_CACHEBUST=${{ env.SOURCE_SHA }}
            GO_PGO_ENABLED=true
            GO_PGO_BENCHTIME=2s
            RUST_PGO_ENABLED=true
            RUST_PGO_BENCH_TIME=2
