name: Phase 2 migration bootstrap

on:
  push:
    branches:
      - modernize/phase2-lofty-react19-rust

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: modernize/phase2-lofty-react19-rust
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Configure Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup override set 1.97.0
      - name: Apply metadata migration
        run: |
          python3 tools/phase2_migrate.py
          gofmt -w adapters/lofty cmd/root.go consts/consts.go
          go mod tidy
          cargo fmt --manifest-path rust/metadata/Cargo.toml
          cargo generate-lockfile --manifest-path rust/metadata/Cargo.toml
      - name: Verify migrated metadata stack
        run: |
          go test ./adapters/lofty ./core/storage/local ./cmd
          cargo test --locked --manifest-path rust/metadata/Cargo.toml
          python3 -m py_compile tools/phase2_migrate.py
          if grep -R -n -E 'go\.senan\.xyz/taglib|github\.com/deluan/go-taglib|tetratelabs/wazero|tetratelabs/wabin|TagLib|TAGLIB_VERSION|TAGLIB_SHA256' go.mod go.sum adapters cmd consts Dockerfile.jbs; then
            echo 'TagLib/WASM dependency remains after migration' >&2
            exit 1
          fi
          grep -q 'navidrome-metadata' Dockerfile.jbs
          grep -q 'DefaultScannerExtractor = "lofty"' consts/consts.go
      - name: Commit generated migration state
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A adapters cmd/root.go consts/consts.go go.mod go.sum rust/metadata Dockerfile.jbs
          git commit -m "refactor: switch scanner metadata to Lofty [phase2-generated]"
          git push origin HEAD:modernize/phase2-lofty-react19-rust
