name: JBS Navidrome CI and GHCR

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: jbs-navidrome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_SUMMARY: "false"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run check-formatting

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  go-lint:
    name: Go lint and generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          problem-matchers: true
          args: --timeout 5m

      - name: Verify formatting and module files
        shell: bash
        run: |
          go run golang.org/x/tools/cmd/goimports@latest -w $(find . -name '*.go' -not -name '*_gen.go' -not -name '*.pb.go')
          go mod tidy
          if [[ -n "$(git status --porcelain)" ]]; then
            git diff --exit-code
            echo 'Run "make format" and commit the generated changes.' >&2
            exit 1
          fi

      - name: Verify generated code
        shell: bash
        run: |
          go generate ./...
          if [[ -n "$(git status --porcelain)" ]]; then
            git diff --exit-code
            echo 'Run "make gen" and commit the generated changes.' >&2
            exit 1
          fi

  go-linux:
    name: Go tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -shuffle=on -tags netgo,sqlite_fts5 -race ./... -v

      - name: Test ndpgen
        shell: bash
        run: |
          cd plugins/cmd/ndpgen
          go test -shuffle=on -v
          go build -o ndpgen .
          ./ndpgen --help

  go-windows:
    name: Go tests (Windows)
    runs-on: windows-2022
    env:
      FFMPEG_VERSION: "7.1"
      FFMPEG_REPOSITORY: navidrome/ffmpeg-windows-builds
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false

      - name: Add MinGW to PATH
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: C:/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-win64

      - name: Download FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $asset = "ffmpeg-n${env:FFMPEG_VERSION}-latest-win64-gpl-${env:FFMPEG_VERSION}"
          $url = "https://github.com/${env:FFMPEG_REPOSITORY}/releases/download/latest/$asset.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath C:/ffmpeg-extracted
          New-Item -ItemType Directory -Force -Path C:/ffmpeg/bin | Out-Null
          Copy-Item "C:/ffmpeg-extracted/$asset/bin/ffmpeg.exe" C:/ffmpeg/bin
          Copy-Item "C:/ffmpeg-extracted/$asset/bin/ffprobe.exe" C:/ffmpeg/bin

      - name: Add FFmpeg to PATH
        shell: bash
        run: echo "C:/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: pwsh
        run: |
          go version
          where.exe gcc
          gcc --version
          ffmpeg -version
          ffprobe -version

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Test
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -shuffle=on -tags netgo,sqlite_fts5 ./... -v

      - name: Test ndpgen
        shell: pwsh
        run: |
          Set-Location plugins/cmd/ndpgen
          go test -shuffle=on -v
          go build -o ndpgen.exe .
          ./ndpgen.exe --help

  i18n:
    name: Validate translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          for file in resources/i18n/*.json; do
            jq empty "$file"
          done

      - name: Validate translations
        run: ./.github/workflows/validate-translations.sh -v

  validate-image:
    name: Build and smoke-test image
    if: github.event_name != 'push'
    needs:
      - frontend
      - go-lint
      - go-linux
      - go-windows
      - i18n
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: jbs-navidrome:ci
          cache-from: type=gha,scope=pr-amd64
          cache-to: type=gha,mode=max,scope=pr-amd64

      - name: Smoke test
        run: docker run --rm jbs-navidrome:ci --help

  publish-platform:
    name: Publish ${{ matrix.platform }} digest
    if: github.event_name == 'push'
    needs:
      - frontend
      - go-lint
      - go-linux
      - go-windows
      - i18n
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish GHCR manifest
    if: github.event_name == 'push'
    needs:
      - publish-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          mapfile -t TAGS < <(jq -r '.tags[]' <<< "$TAGS_JSON")
          args=()
          for tag in "${TAGS[@]}"; do
            args+=(--tag "$tag")
          done
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker buildx imagetools inspect "$IMAGE@${{ needs.publish-platform.outputs.digest }}" || docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
