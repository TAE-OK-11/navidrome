name: JBS Navidrome Debian 13 CI and GHCR

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: jbs-navidrome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "true"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build on Debian 13
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: public.ecr.aws/docker/library/debian:13-slim
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Bootstrap Debian 13
        working-directory: /
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            gzip \
            python3 \
            tar \
            xz-utils
          rm -rf /var/lib/apt/lists/*
          . /etc/os-release
          test "$ID" = "debian"
          test "$VERSION_ID" = "13"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run check-formatting

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production UI
        run: npm run build

  go-lint:
    name: Go validation on Debian 13
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: public.ecr.aws/docker/library/debian:13-slim
    steps:
      - name: Bootstrap Debian 13
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            gzip \
            pkg-config \
            tar \
            xz-utils \
            zlib1g-dev
          rm -rf /var/lib/apt/lists/*
          . /etc/os-release
          test "$ID" = "debian"
          test "$VERSION_ID" = "13"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          problem-matchers: true
          args: --timeout 5m

      - name: Verify formatting and module files
        shell: bash
        run: |
          go run golang.org/x/tools/cmd/goimports@latest -w $(find . -name '*.go' -not -name '*_gen.go' -not -name '*.pb.go')
          go mod tidy
          if [[ -n "$(git status --porcelain)" ]]; then
            git diff --exit-code
            echo 'Run "make format" and commit the generated changes.' >&2
            exit 1
          fi

      - name: Verify generated code
        shell: bash
        run: |
          go generate ./...
          if [[ -n "$(git status --porcelain)" ]]; then
            git diff --exit-code
            echo 'Run "make gen" and commit the generated changes.' >&2
            exit 1
          fi

  go-test:
    name: Go tests on Debian 13
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: public.ecr.aws/docker/library/debian:13-slim
    steps:
      - name: Bootstrap Debian 13
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            ffmpeg \
            git \
            gzip \
            libwebp-dev \
            mpv \
            pkg-config \
            sqlite3 \
            tar \
            xz-utils \
            zlib1g-dev
          rm -rf /var/lib/apt/lists/*
          . /etc/os-release
          test "$ID" = "debian"
          test "$VERSION_ID" = "13"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Debian toolchain
        shell: bash
        run: |
          cat /etc/debian_version
          go version
          gcc --version
          ffmpeg -version | head -n 1

      - name: Download dependencies
        run: go mod download

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -shuffle=on -tags netgo,sqlite_fts5 -race ./... -v

      - name: Build and test ndpgen
        shell: bash
        run: |
          cd plugins/cmd/ndpgen
          go test -shuffle=on -v
          go build -trimpath -o ndpgen .
          ./ndpgen --help

  i18n:
    name: Translation validation on Debian 13
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: public.ecr.aws/docker/library/debian:13-slim
    steps:
      - name: Bootstrap Debian 13
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            jq
          rm -rf /var/lib/apt/lists/*
          . /etc/os-release
          test "$ID" = "debian"
          test "$VERSION_ID" = "13"

      - uses: actions/checkout@v7

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          for file in resources/i18n/*.json; do
            jq empty "$file"
          done

      - name: Validate translations
        run: ./.github/workflows/validate-translations.sh -v

  validate-image:
    name: Build Debian 13 slim image
    if: github.event_name != 'push'
    needs:
      - frontend
      - go-lint
      - go-test
      - i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 Debian 13 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: jbs-navidrome:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=debian13-pr-amd64
          cache-to: type=gha,mode=max,scope=debian13-pr-amd64

      - name: Verify Debian 13 slim runtime
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/sh jbs-navidrome:ci -ec '
            . /etc/os-release
            test "$ID" = "debian"
            test "$VERSION_ID" = "13"
            ffmpeg -version >/dev/null
            mpv --version >/dev/null
            sqlite3 --version >/dev/null
          '

      - name: Smoke test Navidrome
        run: docker run --rm jbs-navidrome:ci --help

  publish-platform:
    name: Publish Debian 13 ${{ matrix.platform }} digest
    if: github.event_name == 'push'
    needs:
      - frontend
      - go-lint
      - go-test
      - i18n
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build Debian 13 image and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=JBS Networks
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=debian13-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=debian13-${{ matrix.artifact }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish Debian 13 GHCR manifest
    if: github.event_name == 'push'
    needs:
      - publish-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Create and push multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          mapfile -t TAGS < <(jq -r '.tags[]' <<< "$TAGS_JSON")
          args=()
          for tag in "${TAGS[@]}"; do
            args+=(--tag "$tag")
          done
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect published manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
