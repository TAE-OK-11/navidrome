name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build metadata worker
        working-directory: rust/metadata
        run: cargo +1.98.0 build --release --locked
      - name: Build scanner worker
        working-directory: rust/scanner
        run: cargo +1.98.0 build --release --locked
      - name: Test
        env:
          ND_METADATAWORKERPATH: ${{ github.workspace }}/rust/metadata/target/release/navidrome-metadata
          ND_SCANNERWORKERPATH: ${{ github.workspace }}/rust/scanner/target/release/navidrome-scanner
        run: go test -shuffle=on -tags netgo,sqlite_fts5 -race ./...

  lint:
    name: Go lint and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout 5m
      - name: Verify generated files
        run: |
          go generate ./...
          git diff --exit-code

  rust:
    name: Rust tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: metadata
            directory: rust/metadata
          - crate: h3-gateway
            directory: rust/h3-gateway
          - crate: search
            directory: rust/search
          - crate: scanner
            directory: rust/scanner
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Test
        working-directory: ${{ matrix.directory }}
        run: cargo +1.98.0 test --locked

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify Bun 1.4 runtime
        run: |
          case "$(bun --version)" in 1.4.*) ;; *) echo "Bun 1.4 required" >&2; exit 1 ;; esac
          bun -e 'const m = new Map([[2**32, "a"], [2**33, "b"]]); if (m.size !== 2) throw new Error("Bun 1.4 Map/Set large-integer regression detected")'
      - name: Install
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Check
        working-directory: ui
        run: |
          bun run type-check
          bun run check:typescript-migration
          bun run check:mui9
          bun run lint
          bun run check-formatting
          bun run test
      - name: Build
        working-directory: ui
        run: bun run build

  i18n:
    name: i18n validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON and translations
        run: |
          for file in resources/i18n/*.json; do jq empty "$file"; done
          ./.github/workflows/validate-translations.sh -v
