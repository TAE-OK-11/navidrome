name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase3-bootstrap:
    name: Phase 3 UI bootstrap
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'modernize/react19-mui9-phase3' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: modernize/react19-mui9-phase3
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Bootstrap React 19 and MUI 9
        run: |
          if git log -1 --pretty=%B | grep -Fq '[phase3-bootstrap]'; then
            echo 'Bootstrap already committed'
            exit 0
          fi
          cd ui
          bun install --frozen-lockfile
          bunx @mui/codemod@latest v5.0.0/preset-safe src --extensions js,ts,jsx,tsx
          bun remove @material-ui/core @material-ui/icons @material-ui/lab @material-ui/styles connected-react-router history redux-saga
          bun add \
            react@19.2.8 react-dom@19.2.8 \
            react-admin@5.15.1 ra-data-json-server@5.15.0 ra-i18n-polyglot@5.15.0 \
            @mui/material@9.3.1 @mui/icons-material@9.3.1 \
            @mui/system@9.3.0 @mui/utils@9.3.0 @mui/styles@6.4.8 \
            @mui/lab@9.0.0-beta.8 \
            @emotion/react@latest @emotion/styled@latest \
            react-router-dom@6.28.1 \
            @jsonforms/core@3.8.0 @jsonforms/react@3.8.0 @jsonforms/material-renderers@3.8.0 \
            @mui/x-date-pickers@9.10.1
          bun add -d @types/react@19 @types/react-dom@19 @testing-library/react@latest ra-test@5.15.0
          bun run prettier
          cd ..
          if git diff --quiet -- ui; then
            echo 'No bootstrap changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/package.json ui/bun.lock ui/src
          git commit -m 'refactor: bootstrap React 19 and MUI 9 [phase3-bootstrap]'
          git push origin HEAD:modernize/react19-mui9-phase3

  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Test
        run: go test -shuffle=on -tags netgo,sqlite_fts5 -race ./...

  lint:
    name: Go lint and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          args: --timeout 5m
      - name: Verify generated files
        run: |
          go generate ./...
          git diff --exit-code

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify Bun 1.4 runtime
        run: |
          case "$(bun --version)" in 1.4.*) ;; *) echo "Bun 1.4 required" >&2; exit 1 ;; esac
          bun -e 'const m = new Map([[2**32, "a"], [2**33, "b"]]); if (m.size !== 2) throw new Error("Bun 1.4 Map/Set large-integer regression detected")'
      - name: Install
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Check
        working-directory: ui
        run: bun run check-formatting && bun run lint && bun run test
      - name: Build
        working-directory: ui
        run: bun run build

  i18n:
    name: i18n validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON and translations
        run: |
          for file in resources/i18n/*.json; do jq empty "$file"; done
          ./.github/workflows/validate-translations.sh -v
