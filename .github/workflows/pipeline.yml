name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, perf/rust-h3-modernized]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Test
        run: go test -shuffle=on -tags netgo,sqlite_fts5 -race ./...

  lint:
    name: Go lint and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          args: --timeout 5m
      - name: Verify generated files
        run: |
          go generate ./...
          git diff --exit-code

  metadata:
    name: Lofty metadata worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/metadata-worker
      - name: Format for compile validation
        run: cargo fmt --manifest-path rust/metadata-worker/Cargo.toml
      - name: Lint
        run: cargo clippy --manifest-path rust/metadata-worker/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/metadata-worker/Cargo.toml
      - name: Build release worker
        run: cargo build --release --manifest-path rust/metadata-worker/Cargo.toml

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify Bun 1.4 runtime
        run: |
          case "$(bun --version)" in 1.4.*) ;; *) echo "Bun 1.4 required" >&2; exit 1 ;; esac
          bun -e 'const m = new Map([[2**32, "a"], [2**33, "b"]]); if (m.size !== 2) throw new Error("Bun 1.4 Map/Set large-integer regression detected")'
      - name: Install
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Check
        working-directory: ui
        run: bun run check-formatting && bun run lint && bun run test
      - name: Build
        working-directory: ui
        run: bun run build

  i18n:
    name: i18n validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON and translations
        run: |
          for file in resources/i18n/*.json; do jq empty "$file"; done
          ./.github/workflows/validate-translations.sh -v
