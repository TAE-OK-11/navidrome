name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2-generate:
    name: Generate Lofty migration state
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'modernize/phase2-lofty-react19-rust' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Configure Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup override set 1.97.0
      - name: Generate
        run: |
          if [ ! -d adapters/gotaglib ]; then
            echo 'Lofty migration already generated'
            exit 0
          fi
          python3 tools/phase2_migrate.py
          gofmt -w adapters/lofty cmd/root.go consts/consts.go core/artwork/reader_album.go core/artwork/reader_disc.go
          go mod tidy
          cargo fmt --manifest-path rust/metadata/Cargo.toml
          cargo generate-lockfile --manifest-path rust/metadata/Cargo.toml
          go test ./adapters/lofty ./core/storage/local ./core/artwork ./cmd
          cargo test --locked --manifest-path rust/metadata/Cargo.toml
          if grep -R -n -E 'go\.senan\.xyz/taglib|github\.com/deluan/go-taglib|TagLib|TAGLIB_VERSION|TAGLIB_SHA256|taglib-build|libtag(_c)?\.a' go.mod go.sum adapters cmd consts core tests Dockerfile.jbs; then
            echo 'TagLib dependency or implementation remains after migration' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A adapters cmd/root.go consts/consts.go core/artwork go.mod go.sum rust/metadata Dockerfile.jbs
          git commit -m 'refactor: switch scanner metadata to Lofty [phase2-generated]'
          git push origin HEAD:${{ github.head_ref }}

  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Test
        run: go test -shuffle=on -tags netgo,sqlite_fts5 -race ./...

  lint:
    name: Go lint and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          args: --timeout 5m
      - name: Verify generated files
        run: |
          go generate ./...
          git diff --exit-code

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify Bun 1.4 runtime
        run: |
          case "$(bun --version)" in 1.4.*) ;; *) echo "Bun 1.4 required" >&2; exit 1 ;; esac
          bun -e 'const m = new Map([[2**32, "a"], [2**33, "b"]]); if (m.size !== 2) throw new Error("Bun 1.4 Map/Set large-integer regression detected")'
      - name: Install
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Check
        working-directory: ui
        run: bun run check-formatting && bun run lint && bun run test
      - name: Build
        working-directory: ui
        run: bun run build

  i18n:
    name: i18n validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON and translations
        run: |
          for file in resources/i18n/*.json; do jq empty "$file"; done
          ./.github/workflows/validate-translations.sh -v
