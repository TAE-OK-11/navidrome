name: Upgrade quic-go to v0.61.0

on:
  push:
    branches:
      - feat/http3-quic-go
    paths:
      - .github/workflows/quic-go-061-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/http3-quic-go
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Upgrade and tidy modules
        run: |
          go get github.com/quic-go/quic-go@v0.61.0
          go mod tidy
          grep -F 'github.com/quic-go/quic-go v0.61.0' go.mod
          grep -F 'github.com/quic-go/quic-go v0.61.0' go.sum

      - name: Commit generated module files
        run: |
          rm .github/workflows/quic-go-061-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum .github/workflows/quic-go-061-upgrade.yml
          git commit -m 'build(deps): update quic-go to v0.61.0'
          git push origin HEAD:feat/http3-quic-go
