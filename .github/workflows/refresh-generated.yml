name: Refresh generated Go files

on:
  push:
    branches:
      - fix/jbs-ghcr-build-system
    paths:
      - .github/workflows/refresh-generated.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/jbs-ghcr-build-system
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate Go sources
        run: go generate ./...

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- cmd/wire_gen.go plugins/manifest_gen.go; then
            echo "Generated files are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/wire_gen.go plugins/manifest_gen.go
          git commit -m "chore: refresh generated Go sources"
          git push origin HEAD:fix/jbs-ghcr-build-system
