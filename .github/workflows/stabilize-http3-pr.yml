name: Run HTTP3 stabilization

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  stabilize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Execute stabilization recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/stabilize-http3-once.yml').read_text().splitlines()

          def run_block(step_name: str) -> None:
              marker = f'      - name: {step_name}'
              try:
                  start = workflow.index(marker)
              except ValueError as exc:
                  raise SystemExit(f'missing step: {step_name}') from exc
              run_line = start + 1
              while run_line < len(workflow) and workflow[run_line].strip() != 'run: |':
                  run_line += 1
              if run_line == len(workflow):
                  raise SystemExit(f'missing run block: {step_name}')
              lines = []
              for line in workflow[run_line + 1:]:
                  if line.startswith('      - name: '):
                      break
                  if line.startswith('          '):
                      lines.append(line[10:])
                  elif line.strip():
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
                  else:
                      lines.append('')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', '\n'.join(lines)], check=True)

          run_block('Apply HTTP3 stability and build optimizations')
          run_block('Test HTTP3 and PGO plumbing')
          PY

      - name: Commit stabilization changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stabilize-http3-once.yml
          git rm .github/workflows/stabilize-http3-pr.yml
          git rm .github/.stabilize-http3-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/http3.go server/http3_test.go server/server.go server/shutdown.go Makefile Dockerfile go.mod go.sum docs/developers/pgo.md docs/usage/http3.md contrib/sysctl/99-navidrome-quic.conf
          git commit -m "perf(server): stabilize HTTP/3 and add PGO builds"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
