name: Finalize Subsonic TTFB

on:
  push:
    branches:
      - perf/jbs-ghcr-quic-network
    paths:
      - .github/workflows/subsonic-ttfb-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/jbs-ghcr-quic-network
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Add exact Subsonic response length
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/subsonic/api.go')
          s = p.read_text()
          old = '''\tif status != 0 {
          \t\tw.WriteHeader(status)
          \t}'''
          new = '''\t// The payload is already fully marshalled. Publishing the exact identity
          \t// length lets the outer compression middleware choose its codec without
          \t// first copying small API responses into a decision buffer.
          \tw.Header().Set("Content-Length", strconv.Itoa(len(response)))
          \tif status != 0 {
          \t\tw.WriteHeader(status)
          \t}'''
          if old not in s:
              raise SystemExit('target status block not found or already changed')
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w server/subsonic/api.go
      - name: Update klauspost compress
        run: |
          set -euo pipefail
          go get github.com/klauspost/compress@v1.19.1
          go mod tidy
          go mod verify
      - name: Validate affected packages
        run: |
          set -euo pipefail
          go test ./server ./server/subsonic -count=1
          go test ./server -run '^Test(BrotliFallbackNeverUsesZstdNumericLevel|HugeBrotliResponseUsesDedicatedHugePoolLevel|CompressionHonorsAcceptEncodingQualityAndWildcard|SensitiveAuthResponsesAreNeverCompressed)$' -count=1
      - name: Commit validated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/subsonic/api.go go.mod go.sum
          git commit -m "perf(subsonic): expose response size for immediate compression"
          git push origin HEAD:perf/jbs-ghcr-quic-network
