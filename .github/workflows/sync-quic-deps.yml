name: Sync QUIC dependencies

on:
  push:
    branches:
      - perf/jbs-ghcr-quic-network
    paths:
      - go.mod
      - go.sum
      - .github/workflows/sync-quic-deps.yml

permissions:
  contents: write

concurrency:
  group: sync-quic-deps
  cancel-in-progress: true

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/jbs-ghcr-quic-network
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Normalize modules
        run: |
          set -euo pipefail
          go mod tidy
          go mod verify
      - name: Commit normalized module files
        run: |
          set -euo pipefail
          if git diff --quiet -- go.mod go.sum; then
            echo "go.mod/go.sum already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "deps: normalize QUIC module graph"
          git push origin HEAD:perf/jbs-ghcr-quic-network
