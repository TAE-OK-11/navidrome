version: "2"
run:
  build-tags:
    - netgo
    - sqlite_fts5
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dogsled
    - durationcheck
    - errorlint
    - forbidigo
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - rowserrcheck
    - unconvert
    - whitespace
  disable:
    - staticcheck
  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - deprecatedComment
    gosec:
      excludes:
        - G501
        - G401
        - G505
        - G115
    forbidigo:
      forbid:
        - pattern: 'tx\.Exec$'
          msg: "use tx.ExecContext(ctx, ...) in migrations to propagate context"
        - pattern: 'tx\.Query$'
          msg: "use tx.QueryContext(ctx, ...) in migrations to propagate context"
        - pattern: 'tx\.QueryRow$'
          msg: "use tx.QueryRowContext(ctx, ...) in migrations to propagate context"
    govet:
      enable:
        - nilness
  exclusions:
    rules:
      - linters:
          - gosec
        path: _test\.go
        text: "G703"
      # This test deliberately starts with a permissive file and verifies that
      # configuration loading tightens it to owner-only permissions.
      - linters:
          - gosec
        path: conf/configuration_test\.go
        text: "G306"
      # Compression initialization failure intentionally falls back to the raw
      # response path; returning the setup error would drop a valid response.
      - linters:
          - nilerr
        path: server/compression\.go
      # uint64 is the parser's native type and is compared against the signed
      # storage limit before conversion to int64. The expression is deliberate.
      - linters:
          - unconvert
        path: core/stream/hotcache/resolver\.go
      # Promotion is a transactional sequence with shared cleanup paths. Its
      # complexity is explicit and covered by promotion tests.
      - linters:
          - gocyclo
        path: core/stream/hotcache/promotion\.go
      - path-except: 'db/migrations/'
        linters:
          - forbidigo
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
      - _gen\.go$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
