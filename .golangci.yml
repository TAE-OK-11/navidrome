version: "2"
run:
  build-tags:
    - netgo
    - sqlite_fts5
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dogsled
    - durationcheck
    - errorlint
    - forbidigo
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - rowserrcheck
    - whitespace
  disable:
    - staticcheck
    - intrange
    - perfsprint
    - unconvert
  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - deprecatedComment
    gosec:
      excludes:
        - G501
        - G401
        - G505
        - G115
    forbidigo:
      forbid:
        - pattern: 'tx\.Exec$'
          msg: "use tx.ExecContext(ctx, ...) in migrations to propagate context"
        - pattern: 'tx\.Query$'
          msg: "use tx.QueryContext(ctx, ...) in migrations to propagate context"
        - pattern: 'tx\.QueryRow$'
          msg: "use tx.QueryRowContext(ctx, ...) in migrations to propagate context"
    govet:
      enable:
        - nilness
  exclusions:
    rules:
      - linters:
          - gosec
        path: _test\.go
        text: "G703"
      - path-except: 'db/migrations/'
        linters:
          - forbidigo
      # Baseline findings already present in the custom fork before this CI rebuild.
      # These exclusions are intentionally scoped by exact rule, path and message.
      - linters:
          - bodyclose
        path: '^core/artwork/security_regression_test\.go$'
        text: 'response body must be closed'
      - linters:
          - errcheck
        path: '^core/stream/hotcache/sessions\.go$'
        text: 'queuePromotion'
      - linters:
          - gocyclo
        path: '^core/stream/hotcache/(promotion|sessions)\.go$'
        text: 'cyclomatic complexity'
      - linters:
          - gosec
        path: '^conf/configuration_test\.go$'
        text: 'G306:'
      - linters:
          - gosec
        path: '^core/stream/hotcache/(promotion|resolver)\.go$'
        text: 'G703:'
      - linters:
          - gosec
        path: '^server/subsonic/middlewares\.go$'
        text: 'G602:'
      - linters:
          - nilerr
        path: '^server/compression\.go$'
        text: 'error is not nil'
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
      - _gen\.go$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
