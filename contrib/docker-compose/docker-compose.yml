version: '3.6'

volumes:
  navidrome_data:

services:

  navidrome:
    container_name: "navidrome"
    image: deluan/navidrome:latest
    restart: unless-stopped
    read_only: true
    # user: 1000:1000
    ports:
      - "4533:4533"
      - "4533:4533/udp"  # HTTP/3 (QUIC) when ND_ENABLEHTTP3=true
    volumes:
      - "navidrome_data:/data"
      #- "/mnt/music:/music:ro"
