# Recommended for high-throughput QUIC transfers with the tokio-quiche HTTP/3 companion.
# Larger socket buffers reduce UDP drop under concurrent stream + ping traffic and
# keep the inherited H2 bridge from stalling when the UDP path briefly backs up.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.netdev_max_backlog = 5000
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192
