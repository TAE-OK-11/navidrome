syntax = "proto3";

package navidrome.integration.v1;

option go_package = "github.com/navidrome/navidrome/core/integration/gen";

// Language roles:
//   Go  — HTTP edge (Subsonic/Native), SQLite, domain orchestration, event bus.
//   Rust — async outbound I/O, circuit breaking, CPU-bound signing.
// Public client APIs stay HTTP for Subsonic/UI compatibility. Internal
// service-to-service traffic uses this gRPC contract instead of REST/P2P.
//
// Event payloads for phase-2 streaming live in events.proto.

service Outbound {
  rpc Call(HttpRequest) returns (HttpResponse);
  rpc Sign(SignRequest) returns (SignResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HttpRequest {
  string destination = 1;
  string method = 2;
  string url = 3;
  map<string, string> headers = 4;
  bytes body = 5;
  int32 timeout_ms = 6;
}

message HttpResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
  string error = 4;
  // Milliseconds until the upstream allows another request. The Go gateway
  // maps this back to a Retry-After response header for adapter rate limits.
  int32 retry_after_ms = 5;
}

message SignRequest {
  map<string, string> params = 1;
  string secret = 2;
}

message SignResponse {
  string api_sig = 1;
  string error = 2;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string version = 2;
}
