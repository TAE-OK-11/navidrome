# This file controls the MIME types that are used by Navidrome.
# You can add or modify entries to match your needs.
# Any "audio/*" MIME type is considered a valid audio file for Navidrome, but media files will only work properly if
# supported by the Lofty metadata worker and/or ffmpeg.
# Any "image/*" MIME type is considered a valid image file to be used as cover art.

types:
# Audio media: intentionally limited to the production formats supported by this fork.
  .mp3: audio/mpeg
  .opus: audio/ogg
  .aac: audio/aac
  .alac: audio/mp4
  .m4a: audio/mp4
  .flac: audio/flac

# Playlists (not audio codecs)
  .m3u: audio/x-mpegurl
  .pls: audio/x-scpls

# Image
  .gif: image/gif
  .jpg: image/jpeg
  .jpeg: image/jpeg
  .webp: image/webp
  .png: image/png
  .bmp: image/bmp
  .jxl: image/jxl
  .heic: image/heic
  .heif: image/heif

# Audio formats that are unambiguously lossless by extension.
# .m4a can contain either AAC or ALAC, so codec metadata decides that case.
lossless:
  - .flac
  - .alac
