[workspace]
resolver = "2"
members = [
    "apikeys",
    "fts-normalize",
    "grpc-listen",
    "integration",
    "metadata",
    "scanner",
    "search",
]
exclude = [
    "h3-gateway",
    "benchmarks/metadata",
    "benchmarks/scanner",
    "benchmarks/search",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
