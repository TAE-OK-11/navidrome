[package]
name = "navidrome-apikeys"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "navidrome_apikeys"
path = "src/lib.rs"

[[bin]]
name = "navidrome-apikeys"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
hex = "0.4.3"
rand = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
