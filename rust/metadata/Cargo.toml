[package]
name = "navidrome-metadata"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
fast_image_resize = "=6.1.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lofty = "=0.25.1"
quick-xml = { version = "0.37.5", default-features = false, features = ["escape-html"] }
regex = "1.11.1"
deunicode = "1.6.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
webp = { version = "=0.3.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
