[package]
name = "navidrome-metadata"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "navidrome_metadata"
path = "src/lib.rs"

[[bin]]
name = "navidrome-metadata"
path = "src/main.rs"

[dependencies]
fts-normalize = { path = "../fts-normalize" }
anyhow = "1.0.104"
fast_image_resize = "=6.1.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lofty = "=0.25.1"
quick-xml = { version = "0.42.0", default-features = false, features = ["escape-html"] }
regex = "1.13.1"
deunicode = "1.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rayon = "1.12.0"
serde_yaml = "0.9.34"
webp = { version = "=0.3.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
