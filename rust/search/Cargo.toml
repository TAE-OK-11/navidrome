[package]
name = "navidrome-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[lib]
name = "navidrome_search"
path = "src/lib.rs"

[[bin]]
name = "navidrome-search"
path = "src/main.rs"

[dependencies]
fts-normalize = { path = "../fts-normalize" }
anyhow = "1.0.104"
navidrome-grpc-listen = { path = "../grpc-listen" }
prost = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = { version = "0.26.1", default-features = false, features = ["lz4-compression", "mmap"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.13.1", features = ["transport"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.13.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
